<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Personal Finance AI</title>
    <meta
      name="description"
      content="Personal Finance AI: transactions, budgets, forecasts and an AI CFO for your bank statements."
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Cpath d='M8 21.5l5.2-5.4 4 3.6L24 12' fill='none' stroke='white' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <script>
      // Apply the saved theme before first paint (key shared with src/theme/theme.ts).
      try {
        document.documentElement.setAttribute(
          'data-theme',
          localStorage.getItem('pfa-theme') === 'dark' ? 'dark' : 'light',
        );
      } catch (e) {
        /* storage blocked: keep the light default */
      }
    </script>
  </head>
  <body>
    <noscript>Personal Finance AI needs JavaScript.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
